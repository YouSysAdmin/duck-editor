# The documentation site. The pages are the markdown files of this
# directory, mounted into sections below, so they stay readable on GitHub
# and the site shows the same text. Run from the repository root:
# task site:serve.
baseURL = "https://yousysadmin.github.io/duck-editor/"
title = "Duck"
theme = "hugo-docs-theme"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[module]
[[module.mounts]]
source = "_index.md"
target = "content/_index.md"
[[module.mounts]]
source = "guide"
target = "content/guide"
[[module.mounts]]
source = "configuration"
target = "content/configuration"
[[module.mounts]]
source = "install.md"
target = "content/guide/install.md"
[[module.mounts]]
source = "editing.md"
target = "content/guide/editing.md"
[[module.mounts]]
source = "pickers.md"
target = "content/guide/pickers.md"
[[module.mounts]]
source = "ops.md"
target = "content/guide/ops.md"
[[module.mounts]]
source = "files.md"
target = "content/guide/files.md"
[[module.mounts]]
source = "troubleshooting.md"
target = "content/guide/troubleshooting.md"
[[module.mounts]]
source = "keys.md"
target = "content/guide/keys.md"
[[module.mounts]]
source = "commands.md"
target = "content/guide/commands.md"
[[module.mounts]]
source = "config.md"
target = "content/configuration/config.md"
[[module.mounts]]
source = "languages.md"
target = "content/configuration/languages.md"
[[module.mounts]]
source = "tools.md"
target = "content/configuration/tools.md"
[[module.mounts]]
source = "queries.md"
target = "content/configuration/queries.md"
[[module.mounts]]
source = "themes.md"
target = "content/configuration/themes.md"
[[module.mounts]]
source = "remote.md"
