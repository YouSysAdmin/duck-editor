# The default linter set (errcheck, govet, ineffassign, staticcheck,
# unused) plus the small linters that catch regressions cheaply. The
# database and HTTP linters of the other projects have nothing to look
# at here.
version: "2"

linters:
  default: standard

  enable:
    # errorlint keeps an error in the chain where errors.Is and errors.As
    # can reach it.
    - errorlint
    - copyloopvar
    - durationcheck
    - intrange
    - misspell
    - nolintlint
    - unconvert
    - wastedassign

  # Grammar repositories cloned by `task grammars` ship their own Go
  # bindings, which are not part of this module.
  exclusions:
    paths:
      - runtime/grammars/

  settings:
    staticcheck:
      checks:
        - all
        # QF1001 rewrites `!(r >= 'a' && r <= 'z')` into
        # `r < 'a' || r > 'z'`, which makes the reader rebuild "not in
        # this range".
        - -QF1001
